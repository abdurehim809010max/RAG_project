name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    uses: ./.github/workflows/frontend-ci.yml

  publish:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-backend:sha-${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
          tags: |
            ${{ steps.image.outputs.prefix }}-frontend:sha-${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-frontend:latest

      # DEPLOY PLACEHOLDER: replace this step with the target platform command.
      # SSH option requires: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, and
      # DEPLOY_KNOWN_HOSTS repository/environment secrets.
      # Cloud option requires: CLOUD_PROVIDER credentials, project/account,
      # region, and service/cluster secrets appropriate to that provider.
      - name: Deploy placeholder (disabled)
        if: ${{ false }}
        run: |
          echo "Replace this step with the provider-specific deployment command."
